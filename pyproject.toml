[project]
name = "physoce-datasets"
dynamic = ["version"]
description = "A Python package and CLI for downloading various physical oceanographic datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cdsapi>=0.7.7",
    "cfgrib>=0.9.15.1",
    "click>=8.2.1",
    "copernicusmarine>=2.3.0",
    "earthaccess>=0.18.0",
    "ecmwf-datastores-client>=0.5.1",
    "gcsfs>=2026.3.0",
    "gsw>=3.6.21",
    "h5py>=3.16.0",
    "harmony-py>=1.3.4",
    "ipykernel>=7.2.0",
    "metpy>=1.7.1",
    "numpy>=2.4.4",
    "pycoare>=0.4.0",
    "pydap>=3.5.9",
    "requests>=2.32.5",
    "xarray[accel,io,parallel]>=2026.2.0",
]

[dependency-groups]
dev = [
    "mkdocstrings-python>=2.0.5",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "zensical>=0.0.46",
]
notebook = ["ipykernel>=7.2.0", "matplotlib>=3.10.8"]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "RET504",
    "D203",
    "D213",
    "COM812",
    "CPY001",
    # don't use with ruff formatting as per https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "COM812",
    "COM819",
    "E501",  # formatting should get this, but can sometimes allow long lines
]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["logging"]

[tool.ruff.lint.pylint]
max-args = 10

[project.scripts]
physoce-datasets = "physoce_datasets.cli:cli"

[build-system]
requires = ["hatchling>=1.26.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/physoce_datasets"]
