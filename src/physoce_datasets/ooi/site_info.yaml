ctd_variables: &ctd_variables
  - time
  - depth
  - sea_water_pressure
  - sea_water_practical_salinity
  - sea_water_temperature
fluorometer_variables: &fluorometer_variables
  - time
  - depth
  - fluorometric_cdom
  - fluorometric_chlorophyll_a
  - optical_backscatter
  - total_volume_scattering_coefficient
spectrophotometer_variables: &spectrophotometer_variables
  - time
  - depth
  - optical_absorption
  - beam_attenuation
oxygen_variables: &oxygen_variables
  - time
  - depth
  - dissolved_oxygen
nitrate_variables: &nitrate_variables
  - time
  - depth
  - salinity_corrected_nitrate
irradiance_variables: &irradiance_variables
  - time
  - depth
  - spectra
  - spkir_abj_cspp_downwelling_vector
parad_variables: &par_variables
  - time
  - depth
  - parad_j_par_counts_output

ctd_title: &ctd_title CTD Data from OOI Endurance Array Mooring
fluorometer_title: &fluorometer_title Fluorometer Data from OOI Endurance Array Mooring
spectrophotometer_title: &spectrophotometer_title Spectrophotometer Data from OOI Endurance Array Mooring
oxygen_title: &oxygen_title Oxygen Data from OOI Endurance Array Mooring
nitrate_title: &nitrate_title Nitrate Data from OOI Endurance Array Mooring
irradiance_title: &irradiance_title Irradiance Data from OOI Endurance Array Mooring
par_title: &par_title PAR Data from OOI Endurance Array Mooring

ctd_description: &ctd_description CTD data from OOI Endurance Array moorings, obtained via the OOI THREDDS catalog. This dataset includes absolute salinity, conservative temperature, and density derived from practical salinity, temperature, and pressure calculated and provided by OOI.
fluorometer_description: &fluorometer_description Fluorometer data from OOI Endurance Array moorings, obtained via the OOI THREDDS catalog. This dataset includes processed variables such as chlorophyll a concentration, colored dissolved organic matter concentration (CDOM), optical backscatter, and total volume scattering coefficient calculated and provided by OOI.
spectrophotometer_description: &spectrophotometer_description Spectrophotometer data from OOI Endurance Array moorings, obtained via the OOI THREDDS catalog. This dataset includes processed variables such as optical absorption and beam attenuation calculated and provided by OOI.
oxygen_description: &oxygen_description Oxygen data from OOI Endurance Array moorings, obtained via the OOI THREDDS catalog. This dataset includes dissolved oxygen concentration calculated and provided by OOI.
nitrate_description: &nitrate_description Nitrate data from OOI Endurance Array moorings, obtained via the OOI THREDDS catalog. This dataset includes nitrate concentration calculated and provided by OOI.
irradiance_description: &irradiance_description Irradiance data from OOI Endurance Array moorings, obtained via the OOI THREDDS catalog. This dataset includes downwelling spectral irradiance calculated and provided by OOI.
par_description: &par_description PAR data from OOI Endurance Array moorings, obtained via the OOI THREDDS catalog. This dataset includes photosynthetically active radiation (PAR) calculated and provided by OOI.

